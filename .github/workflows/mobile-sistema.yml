name: Mobile — testes de sistema I137

on:
  pull_request:
    branches: [develop]
    paths:
      - "src/frontend-mobile/**"
      - "src/backend/**"
      - ".github/workflows/mobile-sistema.yml"
  push:
    branches: [develop]
    paths:
      - "src/frontend-mobile/**"
      - "src/backend/**"
      - ".github/workflows/mobile-sistema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sistema:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar .NET 10
        uses: ./.github/actions/preparar-dotnet
      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Permitir aceleração KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Duas execuções num emulador sem interface
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          arch: x86_64
          target: google_apis
          profile: pixel_8
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -timezone Europe/Lisbon
          script: python3 src/frontend-mobile/tests/sistema/executar.py --serial emulator-5554
      - name: Publicar resultados, JUnit e capturas de falhas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i137-testes-sistema-mobile
          path: src/frontend-mobile/tests/sistema/resultados/
          if-no-files-found: warn
          retention-days: 30
